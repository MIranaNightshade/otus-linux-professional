---
- name: Настроить log сервер  
  hosts: all
  become: true

  tasks:

    - name: Проверить наличие бинарного GPG-ключа
      ansible.builtin.stat:
        path: /usr/share/keyrings/elastic-archive-keyring.gpg
      register: gpg_key_stat

    - name: Скачать и конвертировать GPG-ключ (только если файла нет)
      ansible.builtin.shell: |
        curl -fsSL https://artifacts.elastic.co/GPG-KEY-elasticsearch | gpg --batch --yes --dearmor -o /usr/share/keyrings/elastic-archive-keyring.gpg
      when: not gpg_key_stat.stat.exists 
    
    - name: Добавить репозиторий ELK.
      ansible.builtin.lineinfile:
        path: /etc/apt/sources.list.d/elastic-8.x.list
        line: 'deb [signed-by=/usr/share/keyrings/elastic-archive-keyring.gpg] https://mirror.yandex.ru/mirrors/elastic/8/ stable main'
        create: true
    
    - name: Обновить кэш apt (apt update).
      ansible.builtin.apt:
        update_cache: true    
    
    - name: Установка пакетов
      ansible.builtin.package:
        name: "{{ item }}"
        state: present
      loop:
       - default-jdk
       - logstash
       - elasticsearch
       - kibana

    - name: заменить elasticsearch.yml
      ansible.builtin.copy:
        src: elasticsearch.yml
        dest: /etc/elasticsearch/elasticsearch.yml
        mode: '0644'
        owner: root
        group: root

    - name: заменить logstash.yml
      ansible.builtin.copy:
        src: logstash.yml
        dest: /etc/logstash/logstash.yml
        mode: '0644'
        owner: root
        group: root

    - name: заменить logstash-nginx.conf
      ansible.builtin.copy:
        src: logstash-nginx.conf
        dest: /etc/logstash/conf.d/logstash-nginx.conf
        mode: '0644'
        owner: root
        group: root

    - name: заменить pipelines.yml
      ansible.builtin.copy:
        src: pipelines.yml
        dest: /etc/logstash/pipelines.yml
        mode: '0644'
        owner: root
        group: root       

    - name: заменить logstash-audit.conf
      ansible.builtin.copy:
        src: logstash-audit.conf
        dest: /etc/logstash/conf.d/logstash-audit.conf
        mode: '0644'
        owner: root
        group: root               

    - name: Настроить kibana
      ansible.builtin.blockinfile:
        path: /etc/kibana/kibana.yml
        marker: "# {mark} ANSIBLE MANAGED BLOCK #"
        block: |
          server.port: 5601
          server.host: "0.0.0.0"
    
                
    - name: Перезагрузить сервисы
      ansible.builtin.systemd_service:
        name: "{{ item }}"
        state: restarted
        enabled: true
      loop:
       - logstash
       - elasticsearch
       - kibana
