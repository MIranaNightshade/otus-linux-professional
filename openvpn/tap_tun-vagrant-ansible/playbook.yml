---
- name: OpenVPN
  hosts: all
  become: true
  vars:
    dev_mode: tun
  tasks:

  - name: install base tools
    apt:
      name:
        - openvpn
        - easy-rsa
        - iperf3
      state: present
      update_cache: true


  - name: Initialize static key
    ansible.builtin.command:
      cmd:  openvpn --genkey secret /etc/openvpn/static.key
      creates: /etc/openvpn/static.key

  
  - name: Fetch file from server to controller
    fetch:
      src: /etc/openvpn/static.key
      dest: /tmp/static.key
      flat: yes
    when: ansible_hostname == "server"


  - name: Copy file from controller to client
    copy:
      src: /tmp/static.key
      dest: /etc/openvpn/static.key
    when: ansible_hostname == "client"  
  



  - name: copy systemd unit
    ansible.builtin.copy:
      src: openvpn.service
      dest: /etc/systemd/system/openvpn@.service
      owner: root
      group: root
      mode: "0644"
    notify:
       - Reload systemd
       - Restart service


  - name: create openvpn conf
    ansible.builtin.template:
      src: openvpn.conf.j2
      dest: "/etc/openvpn/{{ ansible_hostname }}.conf"
      owner: root
      group: root
      mode: "0644"
    notify:
       - Restart service

  handlers:

    - name: Reload systemd
      ansible.builtin.systemd_service:
        daemon_reload: true

    - name: Restart service
      ansible.builtin.systemd_service:
        name: "openvpn@{{ ansible_hostname }}.service"
        state: restarted
